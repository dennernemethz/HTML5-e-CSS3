<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        article{
            padding: 15px; /* distancia entre o conteudo*/
            border: 1px solid black;/*bordas */
            border-radius: 10px;/* bordas arredondadas */
            background-color: silver;/*cor de fundo*/
            margin-bottom: 10px;/*margem entre os conteudos*/
        }
    </style>
</head>
<body>
    <article> <!-- article sao display block fica um em baixo do outro diferente de inline que fica ao lado -->
        <h1>cursos</h1>
        <p>cursos alternativos</p>
    </article>

    <article>
        <h1> cursos 2</h1>
        <p> cursos alternativos 2</p>
    </article>
</body>
</html>
