<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- tipos de listas em html -->

    <h2>listas não ordenadas</h2>

      <ul>
        <li>lista1</li>
        <li>lista2</li>
        <li>lista3</li>
      </ul>
 
      
        <h2>listas ordenada</h2>

        <ol>
          <li>lista1</li>
          <li>lista2</li>
          <li>lista3</li>
        </ol>
 
        <h2>lista de definiçao</h2>

        <dl>
            <dt>tv</dt>
            <dd>lista1</dd>
            <dd>lista2</dd>
            <dd>lista3</dd>
        </dl>
</body>
</html>
